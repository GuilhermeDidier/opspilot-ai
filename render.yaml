# Render blueprint: one Docker web service (Django API + built React SPA).
# The demo runs on SQLite inside the container: Render deletes free Postgres
# databases after 30 days, which took the site down once. Every boot starts
# from freshly seeded demo data. Set ANTHROPIC_API_KEY in the dashboard.
services:
  - type: web
    name: opspilot-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Overrides the DATABASE_URL the deleted database left on the service.
      - key: DATABASE_ENGINE
        value: sqlite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      # Per-IP rate limits for the public "Try it live" endpoint.
      - key: AI_RECOMMEND_BURST_RATE
        value: 8/min
      - key: AI_RECOMMEND_SUSTAINED_RATE
        value: 40/hour
